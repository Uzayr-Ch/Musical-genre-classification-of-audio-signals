# configs/default.yaml

# 1. Audio Preprocessing Parameters (The Contract)
audio:
  sample_rate: 16000
  duration: 5.0       # 5 seconds of audio per clip
  n_mels: 128         # Height of the spectrogram image
  n_fft: 2048
  hop_length: 512

# 2. Model Architecture Parameters
model:
  num_genres: 10
  cnn_embed_size: 256
  cnn_freq_out: 8     # Depends on max-pooling layers
  transformer_heads: 8
  transformer_layers: 4
  dropout: 0.3

# 3. Training Parameters (For Phase 2)
training:
  batch_size: 16
  epochs: 50
  learning_rate: 0.001